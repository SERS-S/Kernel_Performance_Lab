[package]
name = "kpl_frontend"
version = "0.1.0"
edition = "2021"

[lib]
name = "kpl_frontend"
crate-type = ["staticlib"]

[dependencies]
eframe = { version = "0.34.1", default-features = false, features = ["wayland", "glow", "persistence"] }
egui = "0.34.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
